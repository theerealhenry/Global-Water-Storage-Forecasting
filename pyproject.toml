[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tws-forecast"
version = "0.1.0"
description = "State-reconstruction pipeline forecasting global Total Water Storage anomalies (Zindi/ITU 'A Step Ahead of Drought')"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
