# Shrinkage-regularized per-location historical statistics (mean, std,
# trend, seasonality amplitude, ACF(1/3/6/12), SPEI/soil-moisture
# response) -- state.signatures.LocationSignature, Project Phase 4 step
# 4.2. Consumed by state/signatures.py; not yet built as of step 4.4
# (this file exists so step 4.2 has a config to implement against from
# the start, per the project's config-driven-not-hardcoded discipline).

name: signatures
feature_type: signatures
description: >
  Every location-level aggregate this project computes is shrunk toward
  the global estimate as theta_hat = w * theta_location + (1 - w) *
  theta_global, w = n / (n + shrinkage_k), rather than used as a naive
  per-location statistic -- naive per-(location, calendar-month)
  climatology (Baseline C) overfit badly enough out-of-fold to underperform
  even the plain global mean (docs/ASSUMPTIONS.md A-014).
source_rationale: >
  docs/PHASE4_EXECUTION_PLAN.md Section 0 (shrinkage formula) and Section
  4.2; docs/ASSUMPTIONS.md A-014; docs/ARCHITECTURE.md Sections 4, 10, 17.

# w = n / (n + shrinkage_k) -- chosen so a location needs roughly 2-3
# years of monthly history (~30 observations) before its own signal
# outweighs the global prior. Starting value only: step 4.9's proof
# notebook ablates this against the A-014 held-out standard and the
# final value is recorded there, not assumed correct here.
shrinkage_k: 30

# Trailing windows (months) used for observation-density and local-trend
# fields, matching state.reconstruction.build_state_snapshot's own
# trailing_windows parameter so both modules stay consistent.
trailing_windows: [12, 24]
